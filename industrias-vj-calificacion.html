    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1f3c88, #3a6ea5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.25);
            text-align: center;
        }

        h2 {
            color: #1f3c88;
            margin-bottom: 5px;
        }

        p {
            color: #555;
            font-size: 14px;
        }

        .stars {
            display: flex;
            justify-content: center;
            flex-direction: row-reverse;
            margin: 15px 0;
        }

        .stars input {
            display: none;
        }

        .stars label {
            font-size: 32px;
            color: #ccc;
            cursor: pointer;
            transition: 0.2s;
        }

        .stars input:checked ~ label,
        .stars label:hover,
        .stars label:hover ~ label {
            color: gold;
        }

        textarea {
            width: 100%;
            height: 70px;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            resize: none;
            font-size: 14px;
        }

        button {
            margin-top: 12px;
            padding: 10px;
            width: 100%;
            background: #1f3c88;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #16306b;
        }

        #mensaje {
            margin-top: 10px;
            color: green;
            font-weight: bold;
        }

        footer {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
        }
